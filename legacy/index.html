<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>优选商城 - 精选好物</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="#">🛍️ 优选商城</a>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索商品..." />
        <button id="searchBtn">🔍</button>
      </div>
      <nav class="nav">
        <a href="#" data-nav>首页</a>
        <a href="#products" data-nav>商品</a>
        <button class="cart-btn" id="cartBtn">
          🛒 购物车
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- 轮播 Banner -->
  <section class="banner">
    <div class="banner-track" id="bannerTrack">
      <div class="banner-slide slide-1 active">
        <div class="banner-content">
          <h1>夏季大促 · 低至 5 折</h1>
          <p>全场爆款限时特惠，错过再等一年</p>
          <a href="#products" class="btn-primary">立即抢购</a>
        </div>
      </div>
      <div class="banner-slide slide-2">
        <div class="banner-content">
          <h1>新品首发 · 数码专场</h1>
          <p>最新科技产品，抢先体验未来生活</p>
          <a href="#products" class="btn-primary" data-filter-link="数码">查看新品</a>
        </div>
      </div>
      <div class="banner-slide slide-3">
        <div class="banner-content">
          <h1>品质生活 · 家居焕新</h1>
          <p>精选家居好物，打造温馨小家</p>
          <a href="#products" class="btn-primary" data-filter-link="家居">探索家居</a>
        </div>
      </div>
    </div>
    <button class="banner-arrow prev" id="bannerPrev">‹</button>
    <button class="banner-arrow next" id="bannerNext">›</button>
    <div class="banner-dots" id="bannerDots"></div>
  </section>

  <!-- 特色服务 -->
  <section class="features container">
    <div class="feature-item"><span>🚚</span><div><b>极速配送</b><small>全国包邮次日达</small></div></div>
    <div class="feature-item"><span>✅</span><div><b>正品保障</b><small>官方授权假一赔十</small></div></div>
    <div class="feature-item"><span>🔄</span><div><b>七天退换</b><small>无忧售后放心购</small></div></div>
    <div class="feature-item"><span>💬</span><div><b>专属客服</b><small>7×24 小时在线</small></div></div>
  </section>

  <!-- 商品区 -->
  <main class="container products-section" id="products">
    <h2 class="section-title">热门商品</h2>
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-category="全部">全部</button>
      <button class="filter-btn" data-category="数码">数码</button>
      <button class="filter-btn" data-category="服饰">服饰</button>
      <button class="filter-btn" data-category="家居">家居</button>
      <button class="filter-btn" data-category="美妆">美妆</button>
      <button class="filter-btn" data-category="食品">食品</button>
    </div>
    <div class="product-grid" id="productGrid"><!-- 商品由 JS 渲染 --></div>
    <p class="empty-tip" id="emptyTip" hidden>没有找到相关商品 😢</p>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 优选商城 · 精选好物，品质生活</p>
      <p class="footer-links"><a href="#">关于我们</a> · <a href="#">帮助中心</a> · <a href="#">隐私政策</a></p>
    </div>
  </footer>

  <!-- 购物车抽屉 -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>🛒 我的购物车</h3>
      <button class="close-btn" id="closeCart">✕</button>
    </div>
    <div class="cart-items" id="cartItems">
      <p class="cart-empty" id="cartEmpty">购物车还是空的，快去逛逛吧～</p>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>合计：</span>
        <strong id="cartTotal">¥0.00</strong>
      </div>
      <button class="btn-checkout" id="checkoutBtn">去结算</button>
    </div>
  </aside>

  <!-- 商品详情弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="close-btn" id="closeModal">✕</button>
      <div class="modal-img" id="modalImg"></div>
      <div class="modal-info">
        <h3 id="modalName"></h3>
        <p class="modal-desc" id="modalDesc"></p>
        <div class="modal-price-row">
          <span class="price" id="modalPrice"></span>
          <span class="sales" id="modalSales"></span>
        </div>
        <button class="btn-primary btn-add-modal" id="modalAddBtn">加入购物车</button>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <script src="js/main.js"></script>
</body>
</html>
